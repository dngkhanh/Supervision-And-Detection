---
# --- 4. JOB SERVICE HPA (nhóm standard — scale ít hơn) ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: job-service-hpa
  namespace: supervision-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: job-service
  minReplicas: 1
  maxReplicas: 2            # Nhóm standard: max 2 (production: 3)
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# --- 5. APPLICATION SERVICE HPA (nhóm standard) ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
