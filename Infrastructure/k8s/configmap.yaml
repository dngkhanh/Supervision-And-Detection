# ConfigMap cho API Gateway
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: supervision-dev
  labels:
    app: api-gateway
    environment: azure
data:
  PORT: "3000"
  TZ: "Asia/Ho_Chi_Minh"
  NODE_ENV: "production"
  USER_SERVICE_URL: "http://user-service:3001"
  JOB_SERVICE_URL: "http://job-service:3002"
  APPLICATION_SERVICE_URL: "http://application-service:3003"
  RECOMMEND_SERVICE_URL: "http://recommend-service:3004"

