# =============================================================
# DEPLOYMENT — Azure AKS (Production)
# Image pull từ ACR: <acr-name>.azurecr.io/<service>:latest
# imagePullPolicy: Always  — AKS luôn pull từ ACR
# replicas: 1 (HPA sẽ tự scale lên theo tải)
# RabbitMQ: dùng cloud URL (CloudAMQP / Azure Service Bus), không deploy trong cluster
# =============================================================

# =============================================================
# PHẦN 1: NHÓM VIP (api-gateway, user, recommend)
# =============================================================

# --- 1. API GATEWAY ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: supervision-dev
  labels:
    app: api-gateway
    tier: vip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        tier: vip
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: api-gateway
        image: tttnsupervisionacr.azurecr.io/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secret
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

