# =============================================================
# INGRESS — Azure AKS (Production)
# Option A (recommended): NGINX Ingress Controller cài qua Helm
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#   helm install ingress-nginx ingress-nginx/ingress-nginx --namespace ingress-nginx --create-namespace
#
# Option B: Application Gateway Ingress Controller (AGIC) — tích hợp Azure Application Gateway
#   Cài qua AKS add-on: az aks enable-addons --addons ingress-appgw
#
# TLS: dùng cert-manager + Let's Encrypt hoặc upload cert lên Azure Key Vault
#
# ⚠️ TRƯỚC KHI APPLY FILE NÀY:
# 1. Cài NGINX Ingress Controller: helm install ingress-nginx ...
# 2. Lấy External IP: kubectl get svc -n ingress-nginx ingress-nginx-controller
# 3. Thay thế <EXTERNAL-IP> bên dưới với IP thật (dạng: 20.123.45.67)
# 4. Domain sẽ tự động resolve qua nip.io (không cần mua domain)
# =============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supervision-ingress
  namespace: supervision-dev

  labels:
    environment: azure

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - supervision.135.171.160.56.nip.io
    secretName: supervision-tls

  rules:
  - host: supervision.135.171.160.56.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 3000